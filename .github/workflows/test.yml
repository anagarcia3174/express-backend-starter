name: Test Suite

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Wait for MongoDB
      run: |
        for i in {1..10}; do
          if mongosh --eval 'db.runCommand({ ping: 1 })'; then
            echo "MongoDB is ready"
            break
          else
            echo "Waiting for MongoDB..."
            sleep 3
          fi
        done

    - name: Create .env.test file
      run: |
        cat <<EOF > .env.test
        PORT=3000
        NODE_ENV=test
        ACCESS_TOKEN_SECRET=test-access-secret
        REFRESH_TOKEN_SECRET=test-refresh-secret
        EMAIL_VERIFICATION_TOKEN_SECRET=test-email-verification-secret
        RESET_PASSWORD_TOKEN_SECRET=test-password-reset-secret
        MONGO_URL=mongodb://localhost:27017/test_db
        MONGO_TEST_URL=mongodb://localhost:27017/test_db
        EMAIL_FROM=your-email@example.com
        VERIFICATION_LINK=http://localhost:3000/api/auth/verify-email
        RESET_LINK=http://localhost:3000/api/auth/reset-password
        AWS_ACCESS_KEY_ID=your-aws-access-key-id
        AWS_SECRET_ACCESS_KEY=your-aws-secret-access-key
        AWS_REGION=your-aws-region
        EOF

    - name: Run tests
      run: npm test